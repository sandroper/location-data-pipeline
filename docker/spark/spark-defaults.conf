# Url for master node
spark.master                           spark://spark-master:7077
# Enables Logging of events needed for History server
spark.eventLog.enabled                 true
# Output path for master and worker node events
spark.eventLog.dir                     /opt/spark/spark-events
# Input path for history server
spark.history.fs.logDirectory          /opt/spark/spark-events

# JVM options for Java 21+ compatibility (required by Snowflake JDBC driver with Arrow)
spark.driver.extraJavaOptions          --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
spark.executor.extraJavaOptions        --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.misc=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED