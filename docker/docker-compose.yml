
services:
  spark-master:
    image: tkl-pyspark:0.1
    build: .
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port
      - "6066:6066"   # Spark Master REST API
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./data:/opt/spark/data
      - ./spark/spark-data:/opt/spark/work-dir
      - ./spark/spark-logs:/opt/spark/spark-events
    networks:
      - spark-network

  spark-history-server:
    container_name: spark-history
    image: tkl-pyspark:0.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    depends_on:
      - spark-master
    env_file:
      - ./spark/.env.spark
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data
      - ./spark/spark-logs:/opt/spark/spark-events
    ports:
      - '18080:18080'
    networks:
      - spark-network

  spark-worker-1:
    image: tkl-pyspark:0.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"   # Spark Worker Web UI
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/spark-data:/opt/spark/work-dir
      - ./spark/spark-logs:/opt/spark/spark-events
    networks:
      - spark-network

  spark-worker-2:
    image: tkl-pyspark:0.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8082:8081"   # Spark Worker Web UI
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark/spark-data:/opt/spark/work-dir
      - ./spark/spark-logs:/opt/spark/spark-events
    networks:
      - spark-network

  osrm-preprocess:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm-preprocess
    command: > 
      sh -c "chmod +x /scripts/osrm_preprocess.sh && sh /scripts/osrm_preprocess.sh libya-260113"
    volumes:
      - ./osrm/data:/data
      - ./osrm/profiles:/profiles
      - ./osrm/scripts:/scripts

  osrm-map-server:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm
    depends_on:
      osrm-preprocess:
          condition: service_completed_successfully
    command: osrm-routed --algorithm mld /data/work/libya-260113
    ports:
      - "5001:5000"
    volumes:
      - ./osrm/data:/data
    networks:
      - spark-network


networks:
  spark-network:
    driver: bridge

volumes:
  spark-data:
  spark-logs:
